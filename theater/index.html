  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div class="wrap">
    <header class="top">
      <a class="logo" href="./">우리 극장</a>
      <nav class="nav" id="nav">
        <a href="#" data-view="home" class="on">홈</a>
        <a href="#" data-view="watched">봤어요</a>
        <a href="#" data-view="best">인생작</a>
        <a href="#" data-view="want">볼 거예요</a>
      </nav>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>

          <div class="progress-label"><span id="heroDone"></span><span id="heroPct"></span></div>
          <div class="bar"><div class="bar-fill" id="heroBar"></div></div>

          <button class="btn dim" id="writeReview" type="button">한줄평 남기기</button>

      </div>

    <div id="rows"></div>
