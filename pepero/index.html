<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B5121B" />
  <title>2026 빼빼로 운세 | 빼빼로 한 개로 보는 오늘의 운세</title>
  <meta name="description" content="2026년 11월 11일, 빼빼로 한 개로 보는 오늘의 운세. 끌리는 상자를 골라 막대 하나를 뽑아 보세요." />
  <meta property="og:title" content="2026 빼빼로 운세" />
  <meta property="og:description" content="빼빼로 한 개로 보는 오늘의 운세. 끌리는 상자를 골라 막대 하나를 뽑아 보세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=202611111000" />
</head>
<body>
  <div class="app">
    <header class="top">
      <span>2026 빼빼로 운세</span>
      <div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </header>

    <!-- 1. 소개 -->
    <section class="step intro" data-step="intro">
      <div class="head">
        <h1 class="display">빼빼로 한 개로<br />보는 오늘의 운세</h1>
        <p>2026년 11월 11일, 상자 속 빼빼로가<br />당신의 남은 올해를 알려 줄 거예요.</p>
      </div>
      <div class="intro-stage" aria-hidden="true">
        <div class="intro-sticks" id="introSticks"></div>
        <div class="intro-box">
          <div class="intro-box-lid"></div>
          <span class="intro-box-title">2026 · 11 · 11</span>
          <span class="intro-box-sub">FORTUNE STICK BOX</span>
        </div>
      </div>
      <ol class="howto">
        <li><span>01</span>끌리는 빼빼로 상자 고르기</li>
        <li><span>02</span>상자에서 막대 하나 뽑기</li>
        <li><span>03</span>맛에 숨은 운세 확인</li>
      </ol>
      <button class="btn solid" id="start" type="button">운세 보러 가기</button>
    </section>

    <!-- 2. 상자 고르기 -->
    <section class="step pick" data-step="pick" hidden>
      <div class="head">
        <h1 class="display sm">끌리는 상자를<br />하나 골라요</h1>
        <p>맛마다 다른 운세가 들어 있어요.</p>
      </div>
      <div class="packs" id="packs"></div>
      <button class="btn solid" id="draw" type="button" disabled>상자를 먼저 골라 주세요</button>
    </section>

    <!-- 3. 뽑기 + 간단 결과 -->
    <section class="step draw" data-step="draw" hidden>
      <div class="head">
        <span class="label" id="drawBoxName"></span>
        <h1 class="display md" id="drawTitle">하나 꺼내는 중…</h1>
      </div>
      <div class="draw-stage" aria-hidden="true">
        <div class="glow"></div>
        <div class="big-stick stick" id="bigStick"><div class="coat"></div><div class="biscuit"></div></div>
        <div class="open-box" id="openBox">
          <div class="open-box-lid"></div>
          <span id="openBoxName"></span>
        </div>
      </div>
      <div class="quick" id="quick">
        <div class="quick-row">
          <span class="quick-type" id="quickType"></span>
          <span class="quick-score" id="quickScore"></span>
        </div>
        <p id="quickLine"></p>
      </div>
      <div class="actions">
        <button class="btn ghost" id="again" type="button">다시 고르기</button>
        <button class="btn solid wide" id="toDetail" type="button">자세한 운세 보기</button>
      </div>
    </section>

    <!-- 4. 상세 결과 -->
    <section class="step detail" data-step="detail" hidden>
      <article class="card">
        <div class="card-head">
          <div class="mini-stick stick" id="miniStick"><div class="coat"></div><div class="biscuit"></div></div>
          <div class="card-title">
            <span class="label" id="detailMeta"></span>
            <h2 id="detailHead"></h2>
          </div>
          <div class="score-badge"><b id="detailScore"></b><small>점</small></div>
        </div>
        <p class="detail-text" id="detailText"></p>
        <div class="letter" id="letter" hidden>
          <span class="label">빼빼로에 담은 편지 💌</span>
          <p class="pen" id="letterText"></p>
          <p class="pen sign" id="letterSign"></p>
        </div>
        <dl class="lucky" id="lucky"></dl>
        <div class="advice">
          <span class="label">오늘 해 볼 한 가지</span>
          <span class="pen" id="advice"></span>
        </div>
        <div class="match"><span>같이 먹으면 좋은 맛</span><b id="match"></b></div>
      </article>
      <button class="btn save" id="saveImg" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span>이미지로 저장</span>
      </button>
      <div class="actions">
        <button class="btn ghost" id="home" type="button">처음으로</button>
        <button class="btn solid wide" id="share" type="button">친구에게 빼빼로 보내기</button>
      </div>
    </section>
  </div>

  <script src="fortunes.js?v=202611111000"></script>
  <script src="app.js?v=202611111000"></script>
</body>
</html>
